<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCity Hospital</title>

       <link rel="stylesheet" href="/static/css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Istok+Web:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header>

        <!-- Top Navigation -->
        <div class="top-navbar">

            <div class="top-menu">
                <a href="#">Feedback</a>
                <a href="#">Search</a>
            </div>

            <button class="signin-btn">
                Sign In
            </button>

        </div>

        <!-- Main Navigation -->
        <div class="navbar">

            <div class="logo">

                <img src="images/logo.png" alt="MediCity Logo">

                <h1>
                    <span class="medi">Medi</span>
                    <span class="city">City</span>
                </h1>

            </div>

            <nav>

                <a href="#">Our Specialities</a>

                <a href="#">Book Appointment</a>

                <a href="#" class="call-us">
                    Call Us
                    <img src="images/call-icon.png" alt="Call">
                </a>

            </nav>

        </div>

    </header>

    <!-- Hero Section -->

    <section class="hero">

        <div class="hero-image">
            <img src="images/hospital.jpg" alt="Hospital">
        </div>

        <div class="hero-content">

            <h2>Address :</h2>

            <p>
                MediCity Hospital,<br>
                Mini Bypass Road,<br>
                Calicut, Kerala
            </p>

            <button class="direction-btn">
                Get Directions
            </button>

            <h2>Contact :</h2>

            <p>Email : connect@medicity.in</p>

            <div class="helpline">
                Help line : +91 4234565666
            </div>

        </div>

    </section>

    <!-- Our Specialities -->

    <section class="specialities">

        <h2>Our Specialities</h2>

        <div class="speciality-grid">

            <div class="speciality-card">
                <img src="images/speciality1.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality2.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality3.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality4.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality5.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality6.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality7.jpg" alt="">
            </div>

            <div class="speciality-card">
                <img src="images/speciality8.jpg" alt="">
            </div>

        </div>

    </section>

    <!-- Search Section -->

    <section class="search-section">

        <div class="search-group">

            <label>Specialities :</label>

            <input
                type="text"
                placeholder="Search specialities..."
            >

        </div>

        <div class="search-group">

            <label>Find a Doctor :</label>

            <input
                type="text"
                placeholder="Search Doctor..."
            >

        </div>

        <button class="search-btn">
            Search
        </button>

    </section>

    <!-- Footer -->

    <footer>

        © 2026 MediCity Hospital. All Rights Reserved.

    </footer>

</body>
</html>
