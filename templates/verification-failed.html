<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Failed - MediCity</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="page">
    <header class="header">
        <div class="logo">
            <span class="plus">+</span>
            <span class="medi">Medi</span><span class="city">City</span>
        </div>
    </header>

    <main class="main">
        <section class="content-area">
            <div class="card result-card error">
                <div class="icon-wrap">
                    <div class="main-icon">!</div>
                    <span class="badge one">⚠</span>
                    <span class="badge two">♟</span>
                </div>

                <h1>Verification Failed</h1>

                <p class="result-text">
                    We were unable to verify your profile at this time. Please
                    check your information and try again, or contact our support
                    team for assistance.
                </p>

                <a href="/patient/verify-otp" class="result-btn">Try Again&nbsp; ↻</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        © 2026 MediCity Hospital. All Rights Reserved.
    </footer>
</div>
</body>
</html>
