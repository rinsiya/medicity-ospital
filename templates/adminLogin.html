<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrator Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="plus">+</span>MediCity</div>
  <div class="divider"></div>
  <div class="title">Secure Access</div>
</header>

<main>
  <div class="login-card">
    <h2>Administrator Login</h2>
    <p>Enter your credentials to access the MediCity dashboard.</p>

    <form>
      <label>User ID / Clinical Email</label>
      <input type="email" placeholder="admin@medicity.health">

      <label>Password</label>
      <input type="password" placeholder="••••••••">

      <button type="submit">Sign In →</button>
    </form>
  </div>
</main>

<footer>
  © 2024 MediCity Health Systems. All rights reserved. Secure Clinical Environment.
</footer>

</body>
</html>
