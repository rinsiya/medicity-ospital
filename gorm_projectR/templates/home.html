<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        table tr th {
            width: 5vw;

        }
    </style>
</head>

<body>
    <header class="page-header">
        <h2 class="site-title">Welcome {{.users.Name}}</h2>

        <a href="/logout"><button class="bt-logout">Logout<i class="fa-solid fa-right-from-bracket"></i></button></a>
    </header>
    <div class="error" style="text-align: center; margin-top: 20px;color: brown;">
        {{if .error}}
        <p>{{.error}}</p>
        {{end}}
    </div>
    <main class="user-container">
        <h2><u>Profile</u></h2>

        <form action="/profile/update" method="POST">

            <table class="user-table">

                <tr>
                    <th>ID</th>
                    <td>:{{.users.ID}}</td>
                </tr>
                <tr>
                    <th>Name</th>
                    <td><input type="text" name="name" value="{{.users.Name}}" required /></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td><input type="email" name="email" value="{{.users.Email}}" required />
                    </td>
                </tr>
                <tr>
                    <th>New password</th>
                    <td><input type="password" name="password" placeholder="New Password"></td>
                </tr>

                <tr>
                    <th>Confirm password</th>
                    <td><input type="password" name="confirm_password" placeholder="Confirm Password">

                    </td>
                </tr>
                <tr>
                    <th></th>
                    <td><button type="submit" class="bt-edit">Update</button></td>
                </tr>
            </table>
        </form>

    </main>
    <footer class="page-footer">
        <hr class="footer-line">
        <p>&copy; 2023 . All rights reserved.</p>
    </footer>
</body>

</html>
