<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>
    <header class="page-header">
        <h1 class="site-title">Welcome to the Login Page</h1>
    </header>
    <main class="form-container">

        <h2 class="login-head">Login here</h2>
        {{if .error}}
        <div class="error" style="color: brown;">{{.error}}</div>
        {{end}}

        <form name="Login" onsubmit="return validateForm()" class="login-form" id="login" action="/login" method="POST">
            <div class="form-elem"><label class="form-label"> Email : </label><input type="text" name="email" id="email"
                    onblur="checkEmail()"></div>
            <div id="emailError" class="error"></div>
            <div class="form-elem"><label class="form-label">Password : </label> <input type="password" name="password"
                    id="password" onblur="checkPassword()"></div>
            <div id="passwordError" class="error"></div>
             <div class="form-elem"> <button class="bt-login" type="submit" name="bt-login" id="bt-login">Login</button>
            </div>
        </form>
        <div class="form-elem"> If you don't have an account, <a href="/signup"><b> Signup here</b></a>
        </div>
    </main>
    <footer class="page-footer">
        <hr class="footer-line">
        <p>&copy; 2023 . All rights reserved.</p>
    </footer>
    <script>
        function validateForm() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let emailError = document.getElementById("emailError");
            let passwordError = document.getElementById("passwordError");
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let flag = 1;
            if (email === "") {
                emailError.textContent = "Email is required";
                emailError.style.backgroundColor = "#ff0000";
                flag = 0;
            }
            else if (!email.match(emailPattern)) {
                emailError.textContent = "Please enter a valid email address";
                emailError.style.backgroundColor = "#ff0000";
                flag = 0;

            }
            else {
                emailError.textContent = ""; emailError.style.backgroundColor = "";

            }
            if (password === "") {
                passwordError.textContent = "Password is required";
                passwordError.style.backgroundColor = "#ff0000";
                flag = 0;

            }
            else if (password.length < 8) {
                passwordError.textContent = "Password must be at least 8 characters";
                passwordError.style.backgroundColor = "#ff0000";

                flag = 0;

            }
            else {

                passwordError.textContent = ""; passwordError.style.backgroundColor = "";

            }
            if (flag == 0) {
                return false;
            }
            else {
                return true;
            }

        }

        function checkEmail() {
            const input = document.getElementById("email");
            const error = document.getElementById("emailError");


            if (input.value.trim() === "") {
                error.textContent = "Field is empty!!";
                error.style.backgroundColor = "#ff0000";
            }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim())) {
                error.textContent = "This is not a valid email id!!";
                error.style.backgroundColor = "#ff0000"; error.style.backgroundColor = "#ff0000";
            }
            else {
                error.textContent = ""; error.style.backgroundColor = ""; return 1;
            }
        }


        function checkPassword() {
            const input = document.getElementById("password");
            const error = document.getElementById("passwordError");


            if (input.value.trim() === "") {
                error.textContent = "Field is empty!!"; error.style.backgroundColor = "#ff0000";

            }
            else if (input.value.trim().length < 8) {
                error.textContent = "password must contain atleast 8 characters"; error.style.backgroundColor = "#ff0000";
            }
            else {
                error.textContent = ""; error.style.backgroundColor = ""; return 1;
            }
        }

      
    </script>
</body>

</html>
